spring.application.name=cdaxVideo
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ================= DATABASE CONFIGURATION - AIVEN MYSQL =================
spring.datasource.url=jdbc:mysql://cdaxxmysql-crbix-9d23.a.aivencloud.com:25153/defaultdb?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=RenderHikariCP

# ================= JPA / HIBERNATE CONFIGURATION =================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ================= TRANSACTION MANAGEMENT =================
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ================= JACKSON / JSON CONFIGURATION =================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=NON_NULL

# ================= STATIC RESOURCES & FILE UPLOAD =================
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:./uploads/
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# ================= ACTUATOR / HEALTH CHECKS =================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ================= JWT SECURITY CONFIGURATION =================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.issuer=${JWT_ISSUER:cdaxVideo}
jwt.header=Authorization
jwt.prefix=Bearer

# ================= CORS CONFIGURATION =================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
cors.exposed-headers=Authorization,Content-Disposition
cors.allow-credentials=true
cors.max-age=3600

# ================= LOGGING CONFIGURATION =================
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.example.cdaxVideo=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=INFO

# Log pattern for Render
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ================= CACHE CONFIGURATION =================
spring.cache.type=simple
spring.cache.cache-names=courses,users,modules,videos,assessments
spring.cache.simple.size-limit=500
spring.cache.simple.time-to-live=600000

# ================= SCHEDULING / ASYNC =================
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ================= SECURITY =================
security.debug=false
spring.security.filter.dispatcher-types=ASYNC,ERROR,REQUEST

# ================= FILE STORAGE =================
file.upload-dir=./uploads
file.max-size=104857600
file.allowed-extensions=jpg,jpeg,png,gif,pdf,mp4,webm,avi,mov

# ================= ENVIRONMENT SPECIFIC =================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ================= SESSION MANAGEMENT =================
server.servlet.session.timeout=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# ================= ERROR HANDLING =================
server.error.include-message=always
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never
server.error.path=/error
server.error.whitelabel.enabled=false

# ================= METRICS & MONITORING =================
management.metrics.enable.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}