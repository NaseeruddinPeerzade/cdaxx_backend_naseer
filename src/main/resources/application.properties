# Server Configuration
server.port=${SERVER_PORT:8888}

# Database Configuration - Aiven MySQL
spring.datasource.url=jdbc:mysql://cdaxxmysql-crbix-9d23.a.aivencloud.com:25153/defaultdb?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.example.cdaxVideo=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}

# Additional MySQL Connection Properties
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000